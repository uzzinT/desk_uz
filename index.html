<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>desk_uz · 업무 자료실</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232F5BEA'/><text x='16' y='22' font-size='15' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>uz</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg: #F5F6F8; --card: #FFFFFF; --ink: #191F28; --muted: #6B7684; --line: #E5E8EB;
    --accent: #2F5BEA; --accent-soft: #EBF0FE; --file: #0F8A5F; --file-soft: #E6F4EE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --card: #1A1D23; --ink: #E8EAED; --muted: #9AA3AE; --line: #2A2F37;
      --accent: #7B9BFF; --accent-soft: #1E2740; --file: #4CC79A; --file-soft: #15302A;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Pretendard, system-ui, sans-serif; line-height: 1.5; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 12px; padding-top: 18px; padding-bottom: 18px; }
  .logo { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 17px; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .admin { margin-left: auto; color: var(--muted); text-decoration: none; font-size: 14px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; white-space: nowrap; }
  .admin:hover, .admin:focus-visible { color: var(--accent); border-color: var(--accent); }
  main.wrap { padding-top: 20px; padding-bottom: 64px; }
  input[type=search] {
    width: 100%; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); font: inherit;
  }
  input[type=search]::placeholder { color: var(--muted); }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 8px; }
  .chips button {
    font: inherit; font-size: 14px; cursor: pointer; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
  }
  .chips button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--card); font-weight: 600; }
  section { margin-top: 28px; }
  h2 { font-size: 15px; font-weight: 700; color: var(--muted); margin: 0 0 8px; display: flex; gap: 6px; }
  h2 small { font-weight: 500; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .item {
    display: flex; flex-direction: column; gap: 10px; padding: 16px; min-height: 150px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .item:hover, .item:focus-visible { border-color: var(--accent); box-shadow: 0 6px 18px #0000000f; transform: translateY(-2px); outline: none; }
  @media (prefers-reduced-motion: reduce) { .item { transition: none; } .item:hover { transform: none; } }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .badge {
    width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
    font-size: 11px; font-weight: 800; letter-spacing: .02em; background: var(--accent-soft); color: var(--accent);
  }
  .badge.file { background: var(--file-soft); color: var(--file); }
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .title { font-weight: 700; font-size: 17px; line-height: 1.35; }
  .desc { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { font-size: 12px; color: var(--muted); opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .action { font-size: 13px; font-weight: 600; color: var(--accent); padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); white-space: nowrap; }
  .action.file { color: var(--file); background: var(--file-soft); }
  [hidden] { display: none !important; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding-bottom: 32px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo" aria-hidden="true">uz</div>
    <div>
      <h1>desk_uz</h1>
      <p>행정 업무 링크 · 서식 자료실</p>
    </div>
    <a class="admin" href="admin.html">⚙️ 관리</a>
  </div>
</header>

<main class="wrap">
  <input type="search" id="q" placeholder="이름이나 설명으로 찾기" aria-label="검색">
  <div class="chips" id="chips" role="group" aria-label="분류"></div>
  <div id="list"></div>
  <p class="empty" id="empty" hidden></p>
</main>

<footer>desk_uz · 링크는 새 탭에서 열리고, 파일은 바로 내려받아요.</footer>

<script src="common.js?v=20261020"></script>
<script>
let categories = [], items = [];
let current = "*"; // chosen category id, "*" = 전체
const OTHER = { id: "_other", name: "기타" };
const $ = id => document.getElementById(id);
const catOf = it => categories.some(c => c.id === it.category) ? it.category : OTHER.id;
const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls, textContent: text ?? "" });

function row(it) {
  const url = safeUrl(it.url);
  const file = isFile(it);
  const a = Object.assign(document.createElement("a"), { className: "item", href: url || "#" });
  if (file) a.download = fileName(it);
  else Object.assign(a, { target: "_blank", rel: "noopener" });

  const top = el("span", "top");
  top.append(el("span", "badge" + (file ? " file" : ""), file ? fileExt(it).slice(0, 4) : "LINK"),
    el("span", "action" + (file ? " file" : ""), file ? "다운로드 ↓" : "열기 ↗"));
  const text = el("span", "text");
  text.append(el("span", "title", it.title));
  if (it.desc) text.append(el("span", "desc", it.desc));
  let host = "";
  try { host = new URL(url).host; } catch {}
  a.append(top, text, el("span", "meta", file ? fileName(it) : host));
  return a;
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const all = [...categories, OTHER];
  const used = all.filter(c => c !== OTHER || items.some(it => catOf(it) === OTHER.id));

  $("chips").replaceChildren(...[{ id: "*", name: "전체" }, ...used].map(c => {
    const b = el("button", "", c.name);
    b.setAttribute("aria-pressed", c.id === current);
    b.onclick = () => { current = c.id; render(); };
    return b;
  }));

  const match = it => (it.title + " " + (it.desc || "") + " " + (isFile(it) ? fileName(it) : "")).toLowerCase().includes(q);
  const sections = used
    .filter(c => current === "*" || c.id === current)
    .map(c => ({ c, list: items.filter(it => catOf(it) === c.id && match(it)) }))
    .filter(s => s.list.length);

  $("list").replaceChildren(...sections.map(({ c, list }) => {
    const sec = document.createElement("section");
    const h = el("h2", "", c.name);
    h.append(el("small", "", list.length));
    const grid = el("div", "cards");
    grid.append(...list.map(row));
    sec.append(h, grid);
    return sec;
  }));
  $("empty").textContent = q ? "찾는 항목이 없어요." : "아직 등록된 항목이 없어요. 오른쪽 위 ⚙️ 관리에서 추가해 주세요.";
  $("empty").hidden = sections.length > 0;
}

$("q").addEventListener("input", render);

fetch("links.json", { cache: "no-cache" })
  .then(r => r.json())
  .then(data => { ({ categories, items } = normalize(data)); render(); })
  .catch(e => { console.error(e); $("empty").textContent = "목록을 불러오지 못했어요. 새로고침(Ctrl+F5)해 주세요."; $("empty").hidden = false; });
</script>
</body>
</html>
